name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check published content
        run: |
          test -s _site/index.html
          test -s _site/cv/index.html
          test -s _site/publications/index.html
          python3 -c "from pathlib import Path; html = Path('_site/publications/index.html').read_text(); assert '<pre' not in html, 'Publication markup rendered as a code block'"
          test -s _site/projects/index.html
          test -s _site/experience/index.html
          test -s _site/teaching/index.html
          test -s _site/assets/css/main.css
          test -s _site/files/Resume__Kandel__Deepak.pdf
          test ! -e _site/CNAME
          test ! -e _site/files/CV.pdf
          test ! -e _site/talks/index.html
          test ! -e _site/posts
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
